name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
  
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Contract
      run: cd contract && npm run build

    - name: Test Contract
      run: cd contract && npm test

    - name: Build API
      run: cd api && npm run build

    - name: Build Frontend (frontend-landing)
      run: cd frontend-landing && npm run build
